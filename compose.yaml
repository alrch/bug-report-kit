services:
  bug-report-kit:
    build: .
    restart: unless-stopped
    environment:
      BUG_KIT_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:7337:7337"
    volumes:
      - ./config.local.json:/app/config.local.json:ro
      - bug-report-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7337/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  bug-report-data:
